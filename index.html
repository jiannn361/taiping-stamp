<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>商圈數位集點系統</title>
    
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 載入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 載入 LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- 載入 Leaflet CSS & JS (地圖功能) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body { background-color: #f8fafc; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .app-container { max-width: 400px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        /* 淺色薄荷綠與水藍漸層 */
        .bg-gradient-primary { background: linear-gradient(135deg, #ccfbf1 0%, #e0f2fe 100%); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 雲朵圖示
        const CloudIcon = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M17.5 19c2.76 0 5-2.24 5-5s-2.24-5-5-5c-.17 0-.34.02-.51.05C16.43 6.13 13.93 4 11 4c-3.87 0-7 3.13-7 7 0 .17 0 .34.02.51C1.75 11.96 0 13.71 0 16c0 2.76 2.24 5 5 5h12.5z"/>
            </svg>
        );

        // 【關鍵】店家權限名單：在這裡綁定 LINE UID
        const SHOP_ADMINS = {
            'U1234567890abcdef1234567890abcdef': { id: 'S01', name: '古早味小吃攤', category: 'food', typeName: '小吃', color: 'text-orange-400' },
            'Uabcdef1234567890abcdef1234567890': { id: 'S02', name: '梅山特色伴手禮', category: 'souvenir', typeName: '伴手禮', color: 'text-pink-400' },
            'U_PUT_YOUR_UID_HERE': { id: 'S03', name: '高山茶語民宿', category: 'stay', typeName: '住宿', color: 'text-teal-400' }
        };

        function App() {
            const [role, setRole] = useState('customer'); // 預設為遊客
            const [activeShop, setActiveShop] = useState(null);
            const [customerPoints, setCustomerPoints] = useState({ food: 0, souvenir: 0, stay: 0 }); 
            const [logs, setLogs] = useState([]); 
            const [copied, setCopied] = useState(false);
            const [isLiffInit, setIsLiffInit] = useState(false);
            const [userProfile, setUserProfile] = useState(null);

            useEffect(() => {
                const initLiff = async () => {
                    try {
                        await liff.init({ liffId: '2009010332-AYjg84ly' }); // LIFF ID
                        
                        if (!liff.isLoggedIn()) {
                            liff.login();
                        } else {
                            const profile = await liff.getProfile();
                            setUserProfile(profile);
                            
                            // 【權限判定】檢查這個人的 UID 有沒有在店家名單裡
                            if (SHOP_ADMINS[profile.userId]) {
                                setRole('shop'); // 變身為店家
                                setActiveShop(SHOP_ADMINS[profile.userId]); // 鎖定該店資訊
                            } else {
                                setRole('customer'); // 一般遊客
                            }
                            setIsLiffInit(true);
                        }
                    } catch (err) {
                        console.error('LIFF Error', err);
                        setIsLiffInit(true);
                    }
                };
                initLiff();
            }, []);

            const copyUID = () => {
                if(userProfile && userProfile.userId) {
                    navigator.clipboard.writeText(userProfile.userId).then(() => {
                        setCopied(true);
                        setTimeout(() => setCopied(false), 2000);
                    });
                }
            };

            const addLog = (message) => {
                const time = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second:'2-digit' });
                setLogs(prev => [`[${time}] ${message}`, ...prev]);
            };

            if (!isLiffInit) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 text-teal-600">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-4 border-teal-600 mb-4"></div>
                        <div className="font-bold tracking-wider text-slate-600">驗證 LINE 授權中...</div>
                    </div>
                );
            }

            return (
                <div className="app-container flex flex-col font-sans">
                    <div className="bg-slate-800 text-white p-3 flex justify-between items-center text-sm z-50">
                        <div className="flex items-center space-x-2 font-bold">
                            {userProfile ? (
                                <>
                                    <img src={userProfile.pictureUrl} alt="Avatar" className="w-7 h-7 rounded-full border border-slate-500" />
                                    <span>{userProfile.displayName}</span>
                                </>
                            ) : (
                                <span>測試模式</span>
                            )}
                        </div>
                        {userProfile && (
                            <div 
                                className="text-[10px] bg-slate-700/50 px-2 py-1 rounded truncate max-w-[120px] cursor-pointer hover:bg-slate-600 transition-colors flex items-center justify-between" 
                                onClick={copyUID}
                            >
                                <span className={copied ? "text-green-400 font-bold" : "text-slate-200"}>
                                    {copied ? "已複製!" : `UID: ${userProfile.userId.substring(0,6)}...`}
                                </span>
                                {!copied && <svg className="w-3 h-3 ml-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>}
                            </div>
                        )}
                    </div>

                    <div className="flex-1 overflow-y-auto bg-slate-50 hide-scrollbar relative">
                        {role === 'customer' 
                            ? <CustomerView pointsObj={customerPoints} setPointsObj={setCustomerPoints} addLog={addLog} userProfile={userProfile} /> 
                            : <ShopView activeShop={activeShop} setCustomerPoints={setCustomerPoints} addLog={addLog} />
                        }
                    </div>
                </div>
            );
        }

        function CustomerView({ pointsObj, setPointsObj, addLog, userProfile }) {
            const [redeemModal, setRedeemModal] = useState(null); 
            const [staffPassword, setStaffPassword] = useState('');
            const [redeemHistory, setRedeemHistory] = useState([]); 
            const [activeTab, setActiveTab] = useState('card'); // 'card', 'rules', or 'map'
            const [showBindingModal, setShowBindingModal] = useState(false);

            const [currentPage, setCurrentPage] = useState(0);
            const scrollContainerRef = React.useRef(null);

            const totalPoints = pointsObj.food + pointsObj.souvenir + pointsObj.stay;
            const customerName = userProfile ? userProfile.displayName : "訪客"; 

            const handleScroll = () => {
                if (scrollContainerRef.current) {
                    const scrollLeft = scrollContainerRef.current.scrollLeft;
                    const width = scrollContainerRef.current.clientWidth;
                    const page = Math.round(scrollLeft / width);
                    if (page !== currentPage) setCurrentPage(page);
                }
            };

            const redeemGifts = [
                { id: 1, name: '商圈特色伴手禮', cost: 5 },
                { id: 2, name: '在地小吃兌換券', cost: 5 },
                { id: 3, name: '風格文創帆布袋', cost: 10 },
                { id: 4, name: '雙人住宿抵用金', cost: 25 },
            ];

            const initiateRedeem = (gift) => {
                if (totalPoints >= gift.cost) setRedeemModal(gift); 
                else alert('點數不足喔！請繼續在商圈消費集點。');
            };

            const confirmStaffRedeem = () => {
                if (staffPassword !== '8888') {
                    alert('❌ 工作人員密碼錯誤！');
                    return;
                }
                let pointsToDeduct = redeemModal.cost;
                let newPoints = { ...pointsObj };
                const categories = ['food', 'souvenir', 'stay'];
                
                for (let cat of categories) {
                    if (pointsToDeduct <= 0) break;
                    if (newPoints[cat] >= pointsToDeduct) {
                        newPoints[cat] -= pointsToDeduct;
                        pointsToDeduct = 0;
                    } else {
                        pointsToDeduct -= newPoints[cat];
                        newPoints[cat] = 0;
                    }
                }

                const serialNumber = `R-${Math.floor(100000 + Math.random() * 900000)}`;
                const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

                setPointsObj(newPoints);
                setRedeemHistory(prev => [{ giftName: redeemModal.name, sn: serialNumber, time: timeStr }, ...prev]);
                addLog(`遊客兌換了 ${redeemModal.name} (序號: ${serialNumber})`);
                
                setRedeemModal(null);
                setStaffPassword('');
            };

            const renderPages = () => {
                let stickers = [];
                for(let i=0; i<pointsObj.food; i++) stickers.push('text-orange-400');
                for(let i=0; i<pointsObj.souvenir; i++) stickers.push('text-pink-400');
                for(let i=0; i<pointsObj.stay; i++) stickers.push('text-teal-400');

                // 最少1頁，超過每10點加1頁
                const totalPages = Math.max(1, Math.ceil(stickers.length / 10));
                const pages = [];
                
                for (let p = 0; p < totalPages; p++) {
                    const slots = [];
                    for (let i = 0; i < 10; i++) {
                        const globalIndex = p * 10 + i;
                        if (stickers[globalIndex]) {
                            slots.push(
                                <div key={i} className="relative flex items-center justify-center w-12 h-12 transform hover:scale-110 transition-transform">
                                    <CloudIcon className={`w-14 h-14 ${stickers[globalIndex]} absolute z-10 drop-shadow-sm`} />
                                    <span className="z-20 text-white text-xs font-bold pt-1">{globalIndex + 1}</span>
                                </div>
                            );
                        } else {
                            slots.push(
                                <div key={i} className="relative flex items-center justify-center w-12 h-12 opacity-40">
                                    <CloudIcon className="w-14 h-14 text-white absolute z-10" />
                                    <span className="z-20 text-teal-700/30 text-xs font-bold pt-1">{globalIndex + 1}</span>
                                </div>
                            );
                        }
                    }
                    
                    pages.push(
                        <div key={p} className="min-w-full flex-shrink-0 px-2 snap-center">
                            <div className="grid grid-cols-5 gap-y-4 gap-x-2 justify-items-center">
                                {slots}
                            </div>
                        </div>
                    );
                }
                return { pages, totalPages };
            };

            const { pages, totalPages } = renderPages();

            return (
                <div className="min-h-full pb-10">
                    <div className="bg-gradient-primary rounded-b-[40px] pb-8 pt-6 px-4 shadow-sm relative z-10">
                        <div className="flex justify-between items-center text-teal-900 mb-6 px-2">
                            <span className="font-bold text-lg tracking-wider">商圈漫遊集點卡</span>
                            <span className="bg-white/60 px-3 py-1 rounded-full text-xs font-bold text-teal-800 max-w-[120px] truncate">
                                {customerName}
                            </span>
                        </div>
                        
                        <div className="text-center text-teal-900 mb-4">
                            <div className="text-sm opacity-80 mb-1 font-bold">目前總點數</div>
                            <div className="text-6xl font-extrabold drop-shadow-sm flex justify-center items-baseline space-x-2">
                                <span>{totalPoints}</span> <span className="text-2xl font-bold">點</span>
                            </div>
                        </div>

                        {}
                        <div className="bg-white/40 backdrop-blur-md rounded-3xl py-5 border border-white/60 shadow-sm mt-4 overflow-hidden relative">
                            <div 
                                ref={scrollContainerRef}
                                onScroll={handleScroll}
                                className="flex overflow-x-auto snap-x snap-mandatory hide-scrollbar"
                            >
                                {pages}
                            </div>
                            
                            {/* 輪播導覽小圓點 */}
                            {totalPages > 1 && (
                                <div className="flex justify-center space-x-2 mt-4">
                                    {Array.from({ length: totalPages }).map((_, idx) => (
                                        <div 
                                            key={idx} 
                                            className={`h-2 rounded-full transition-all ${currentPage === idx ? 'w-4 bg-teal-600' : 'w-2 bg-teal-200'}`}
                                        />
                                    ))}
                                </div>
                            )}
                            
                            <div className="mt-4 mx-5 flex justify-center space-x-4 text-xs text-teal-900 font-bold bg-white/50 py-2 rounded-full">
                                <span className="flex items-center"><span className="w-3 h-3 rounded-full bg-orange-400 mr-1"></span>小吃</span>
                                <span className="flex items-center"><span className="w-3 h-3 rounded-full bg-pink-400 mr-1"></span>伴手禮</span>
                                <span className="flex items-center"><span className="w-3 h-3 rounded-full bg-teal-400 mr-1"></span>住宿</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex justify-center space-x-4 mt-6 mb-4 px-2 border-b border-teal-100">
                        <button onClick={() => setActiveTab('card')} className={`pb-2 font-bold text-sm transition-colors px-2 ${activeTab === 'card' ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-400'}`}>獎項兌換</button>
                        <button onClick={() => setActiveTab('rules')} className={`pb-2 font-bold text-sm transition-colors px-2 ${activeTab === 'rules' ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-400'}`}>紀錄與辦法</button>
                        <button onClick={() => setActiveTab('map')} className={`pb-2 font-bold text-sm transition-colors px-2 ${activeTab === 'map' ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-400'}`}>商圈地圖</button>
                    </div>

                    {}
                    {activeTab === 'card' && (
                        <div className="px-5 space-y-4 animate-fade-in">
                            {redeemGifts.map(gift => {
                                const canRedeem = totalPoints >= gift.cost;
                                return (
                                    <div key={gift.id} onClick={() => initiateRedeem(gift)} className={`bg-white p-4 rounded-2xl shadow-sm border-2 transition-all ${canRedeem ? 'border-teal-500 cursor-pointer active:scale-95' : 'border-slate-100 opacity-60'}`}>
                                        <div className="flex justify-between items-center">
                                            <div className="flex items-center space-x-4">
                                                <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl ${canRedeem ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-400'}`}>🎁</div>
                                                <div>
                                                    <div className="font-bold text-slate-800">{gift.name}</div>
                                                    <div className={`text-sm font-bold mt-1 ${canRedeem ? 'text-teal-600' : 'text-slate-400'}`}>{gift.cost} 點</div>
                                                </div>
                                            </div>
                                            <button className={`px-4 py-2 rounded-xl text-sm font-bold text-white shadow-sm transition-colors ${canRedeem ? 'bg-teal-600 hover:bg-teal-700' : 'bg-slate-300'}`}>兌換</button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {activeTab === 'rules' && (
                        <div className="px-5 space-y-6 animate-fade-in">
                            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center"><span className="text-teal-500 mr-2">✦</span> 我的兌換紀錄</h3>
                                {redeemHistory.length === 0 ? (
                                    <p className="text-center text-slate-400 text-sm py-4">尚無兌換紀錄</p>
                                ) : (
                                    <div className="space-y-3">
                                        {redeemHistory.map((record, idx) => (
                                            <div key={idx} className="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center">
                                                <div>
                                                    <div className="font-bold text-slate-700 text-sm">{record.giftName}</div>
                                                    <div className="text-xs text-slate-400 mt-1">{record.time}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-[10px] text-slate-400 mb-1">核銷序號</div>
                                                    <div className="text-teal-600 font-mono font-bold text-sm bg-teal-50 px-2 py-1 rounded">{record.sn}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 text-sm text-slate-600 space-y-2">
                                <h3 className="font-bold text-slate-700 mb-3 flex items-center"><span className="text-teal-500 mr-2">✦</span> 活動辦法</h3>
                                <p>1. 於合作店家消費滿 200 元即可獲贈 1 點。</p>
                                <p>2. 點數充足時，請至大會服務台出示手機畫面進行兌換。</p>
                                <p className="text-rose-500 font-bold">3. 兌換操作需由大會工作人員輸入密碼，請勿自行操作，若因誤觸導致點數扣除，恕不補發。</p>
                                <p>4. 贈品數量有限，換完為止。</p>
                                <div className="mt-4 pt-3 border-t border-slate-100 text-xs text-slate-400">※ 主辦單位保有最終修改、變更、活動解釋及終止本活動之權利。</div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'map' && (
                        <div className="px-5 space-y-4 animate-fade-in pb-8">
                           <div className="bg-white rounded-2xl p-2 shadow-sm border border-slate-100 h-[400px] w-full overflow-hidden relative z-0">
                               <MapComponent />
                           </div>
                           <div className="text-xs text-slate-500 text-center px-4">
                               <p>點擊地圖上的圖示查看店家資訊。地圖資料同步自 Airtable。</p>
                           </div>
                        </div>
                    )}

                    <div className="px-5 mt-12 mb-8 text-center">
                        <button 
                            onClick={() => setShowBindingModal(true)}
                            className="text-xs text-slate-400 underline decoration-slate-300 hover:text-slate-600"
                        >
                            我是合作店家，需要開通發送點數權限
                        </button>
                    </div>

                    {}
                    {showBindingModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-5">
                            <div className="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl animate-fade-in relative">
                                <div className="bg-slate-800 p-4 text-center text-white">
                                    <h3 className="font-bold text-lg tracking-wider">店家系統綁定申請</h3>
                                </div>
                                <div className="p-6 text-center">
                                    <p className="text-slate-600 text-sm mb-4">請將下方的專屬代碼，傳送給大會工作人員，以便為您綁定店家權限。</p>
                                    
                                    <div className="bg-slate-100 p-4 rounded-xl mb-6 break-all">
                                        <p className="text-xs text-slate-500 mb-1">您的專屬綁定碼</p>
                                        <p className="font-mono font-bold text-slate-800 text-sm select-all">
                                            {userProfile ? userProfile.userId : "請先在 LINE 中開啟"}
                                        </p>
                                    </div>
                                    
                                    <div className="flex flex-col space-y-3">
                                        <button 
                                            onClick={() => {
                                                const text = `【店家權限開通申請】\n你好，我是商圈店家，我的專屬綁定碼是：\n${userProfile.userId}\n請幫我開通發送點數的權限，謝謝！`;
                                                window.location.href = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
                                            }}
                                            className="w-full py-3 rounded-xl bg-green-500 text-white font-bold hover:bg-green-600 transition-colors shadow-md flex justify-center items-center"
                                        >
                                            <svg className="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M24 11.693c0 6.075-5.918 10.999-13.2 10.999-1.282 0-2.479-.153-3.585-.436-1.527.91-3.613 2.158-5.385 2.624-.316.083-.655-.078-.775-.386-.118-.309.006-.653.284-.813 1.396-.8 2.871-2.095 3.58-3.045C1.865 19.167 0 15.65 0 11.693 0 5.618 5.918.694 13.2.694 24 .694 24 5.618 24 11.693z"/></svg>
                                            一鍵傳送給大會 LINE
                                        </button>
                                        <button onClick={() => setShowBindingModal(false)} className="w-full py-3 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200 transition-colors">關閉</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {redeemModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-5">
                            <div className="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl animate-fade-in relative z-50">
                                <div className="bg-rose-500 p-4 text-center text-white">
                                    <h3 className="font-bold text-lg tracking-wider">⚠️ 大會人員核銷專區</h3>
                                    <p className="text-xs opacity-90 mt-1">遊客請勿自行操作，以免點數失效</p>
                                </div>
                                <div className="p-6 text-center">
                                    <p className="text-slate-500 text-sm">即將兌換</p>
                                    <p className="font-bold text-xl mb-2 mt-1">{redeemModal.name}</p>
                                    <p className="text-rose-500 font-bold mb-6 bg-rose-50 inline-block px-3 py-1 rounded-full text-sm">將扣除 {redeemModal.cost} 點</p>
                                    
                                    <input 
                                        type="password" 
                                        placeholder="輸入核銷密碼 (測試:8888)"
                                        value={staffPassword}
                                        onChange={(e) => setStaffPassword(e.target.value)}
                                        className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-center text-xl tracking-widest mb-6 focus:outline-none focus:border-rose-400 transition-colors"
                                    />
                                    <div className="flex space-x-3">
                                        <button onClick={() => {setRedeemModal(null); setStaffPassword('');}} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200 transition-colors">取消</button>
                                        <button onClick={confirmStaffRedeem} className="flex-1 py-3 rounded-xl bg-rose-500 text-white font-bold hover:bg-rose-600 transition-colors shadow-md">確認扣點</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function MapComponent() {
            const mapRef = React.useRef(null);
            const mapInstance = React.useRef(null);

            useEffect(() => {
                if (mapRef.current && !mapInstance.current) {
                    mapInstance.current = L.map(mapRef.current).setView([23.582, 120.558], 14);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
                        maxZoom: 18,
                    }).addTo(mapInstance.current);

                    fetchAirtableData().then(shops => {
                        shops.forEach(shop => {
                            const markerColor = shop.category === 'food' ? '#f59e0b' : 
                                              shop.category === 'souvenir' ? '#f472b6' : '#14b8a6';
                            
                            const customIcon = L.divIcon({
                                className: 'custom-div-icon',
                                html: `<div style="background-color: ${markerColor}; width: 24px; height: 24px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold;">📍</div>`,
                                iconSize: [30, 30],
                                iconAnchor: [15, 15]
                            });

                            const marker = L.marker([shop.lat, shop.lng], { icon: customIcon }).addTo(mapInstance.current);
                            
                            marker.bindPopup(`
                                <div style="text-align:center; padding: 5px;">
                                    <h4 style="font-weight:bold; font-size:16px; margin:0 0 5px 0;">${shop.name}</h4>
                                    <span style="background-color:${markerColor}20; color:${markerColor}; padding:2px 8px; border-radius:12px; font-size:12px;">${shop.type}</span>
                                    <p style="margin:8px 0 0 0; font-size:12px; color:#666;">${shop.address}</p>
                                </div>
                            `);
                        });
                    });
                }
                return () => {
                    if (mapInstance.current) {
                        mapInstance.current.remove();
                        mapInstance.current = null;
                    }
                };
            }, []);

            return <div ref={mapRef} style={{ width: '100%', height: '100%', borderRadius: '12px' }} />;
        }

        async function fetchAirtableData() {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve([
                        { id: 1, name: '梅山阿嬤肉包', category: 'food', type: '小吃', lat: 23.5835, lng: 120.5562, address: '嘉義縣梅山鄉中山路1號' },
                        { id: 2, name: '太平老街茶葉蛋', category: 'food', type: '小吃', lat: 23.5810, lng: 120.5590, address: '嘉義縣梅山鄉太平村' },
                        { id: 3, name: '梅山特色伴手禮', category: 'souvenir', type: '伴手禮', lat: 23.5840, lng: 120.5585, address: '嘉義縣梅山鄉中正路20號' },
                        { id: 4, name: '高山茶語民宿', category: 'stay', type: '住宿', lat: 23.5795, lng: 120.5540, address: '嘉義縣梅山鄉瑞里村' },
                        { id: 5, name: '雲海咖啡廳', category: 'food', type: '小吃', lat: 23.5855, lng: 120.5600, address: '嘉義縣梅山鄉太平村觀景台' },
                    ]);
                }, 500); 
            });
        }

        function ShopView({ activeShop, setCustomerPoints, addLog }) {
            const [amount, setAmount] = useState('');
            const [scanStatus, setScanStatus] = useState('idle'); 

            const parsedAmount = parseInt(amount, 10) || 0;
            const calculatedPoints = Math.floor(parsedAmount / 200);

            const handleScan = () => {
                setScanStatus('scanning');
                setTimeout(() => setScanStatus('found'), 800);
            };

            const handleSubmit = () => {
                if (calculatedPoints <= 0) return;
                
                if (window.confirm(`即將發送 ${calculatedPoints} 點給遊客。\n類別：[${activeShop.typeName}]`)) {
                    setCustomerPoints(prev => ({
                        ...prev,
                        [activeShop.category]: prev[activeShop.category] + calculatedPoints
                    }));
                    alert(`✅ 成功發送 ${calculatedPoints} 點！`);
                    setAmount('');
                    setScanStatus('idle');
                }
            };

            return (
                <div className="min-h-full pb-10">
                    <div className="bg-white p-4 border-b border-slate-200 z-20 relative shadow-sm">
                        <div className="text-xs text-slate-500 mb-2 font-bold flex justify-between items-center">
                            <span>目前登入店家帳號</span>
                            <span className="text-teal-600 bg-teal-50 px-2 py-1 rounded">✅ 已安全綁定</span>
                        </div>
                        <div className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 flex justify-between items-center">
                            <span className="text-slate-700 font-bold text-lg">{activeShop.name}</span>
                            <span className={`text-xs font-bold px-3 py-1 rounded-full bg-white border ${activeShop.color} border-current`}>
                                發放類別：{activeShop.typeName}
                            </span>
                        </div>
                    </div>

                    <div className="p-5">
                        <div className="bg-white rounded-3xl p-6 shadow-md border border-slate-100 relative z-10">
                            {scanStatus === 'idle' && (
                                <button onClick={handleScan} className="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-10 rounded-2xl flex flex-col items-center shadow-md transition-colors active:scale-95 cursor-pointer z-20 relative">
                                    <span className="text-4xl mb-2">📱</span>
                                    <span className="text-lg">點擊掃描客人條碼</span>
                                </button>
                            )}

                            {scanStatus === 'scanning' && (
                                <div className="w-full bg-slate-50 py-12 rounded-2xl flex flex-col items-center text-teal-600 border border-slate-200 shadow-inner">
                                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-teal-600 mb-3"></div>
                                    <span className="font-bold">相機啟動中...</span>
                                </div>
                            )}

                            {scanStatus === 'found' && (
                                <div className="space-y-6 animate-fade-in relative z-20">
                                    <div className="bg-emerald-50 text-emerald-700 p-3 rounded-xl text-center text-sm font-bold border border-emerald-200">
                                        ✅ 已成功鎖定遊客
                                    </div>
                                    <div>
                                        <label className="block text-slate-600 text-sm mb-2 font-bold text-center">輸入消費總金額 (NT$)</label>
                                        <input 
                                            type="number" 
                                            value={amount}
                                            onChange={(e) => setAmount(e.target.value)}
                                            className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-4 text-3xl text-center font-bold outline-none focus:border-teal-400 transition-colors shadow-inner relative z-30"
                                            placeholder="0"
                                            style={{position: 'relative', zIndex: 30}}
                                        />
                                    </div>
                                    <div className="bg-teal-50 p-4 rounded-2xl flex justify-between items-center border border-teal-100">
                                        <span className="text-teal-800 font-bold text-sm">系統自動換算點數</span>
                                        <div className="flex items-center space-x-2">
                                            <span className={`font-bold text-3xl ${activeShop.color}`}>{calculatedPoints}</span>
                                            <span className="text-sm text-slate-500">點</span>
                                        </div>
                                    </div>
                                    <div className="flex space-x-3 relative z-30 pt-2">
                                        <button onClick={() => {setScanStatus('idle'); setAmount('');}} className="flex-1 bg-slate-100 hover:bg-slate-200 py-4 rounded-2xl font-bold text-slate-600 transition-colors active:scale-95 cursor-pointer">取消</button>
                                        <button 
                                            onClick={handleSubmit} 
                                            disabled={calculatedPoints <= 0} 
                                            className={`flex-[2] py-4 rounded-2xl font-bold text-lg shadow-md transition-all active:scale-95 ${calculatedPoints > 0 ? 'bg-teal-500 hover:bg-teal-600 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                        >
                                            確認發送
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
