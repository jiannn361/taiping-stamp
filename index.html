<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>商圈數位集點系統</title>
    
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 載入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 載入 LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- 載入 Leaflet 地圖套件 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- 載入 HTML5 QR Code 掃描套件 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { background-color: #f8fafc; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .app-container { max-width: 400px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .bg-gradient-primary { background: linear-gradient(135deg, #ccfbf1 0%, #e0f2fe 100%); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes slideDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .animate-slide-down { animation: slideDown 0.3s ease-out forwards; }
        /* 解決地圖 z-index 問題 */
        .leaflet-container { z-index: 1 !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CloudIcon = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M17.5 19c2.76 0 5-2.24 5-5s-2.24-5-5-5c-.17 0-.34.02-.51.05C16.43 6.13 13.93 4 11 4c-3.87 0-7 3.13-7 7 0 .17 0 .34.02.51C1.75 11.96 0 13.71 0 16c0 2.76 2.24 5 5 5h12.5z"/>
            </svg>
        );

        const SHOP_ADMINS = {
            'U1234567890abcdef1234567890abcdef': { id: 'S01', name: '古早味小吃攤', category: 'food', typeName: '小吃', color: 'text-orange-400' },
            'Uabcdef1234567890abcdef1234567890': { id: 'S02', name: '梅山特色伴手禮', category: 'souvenir', typeName: '伴手禮', color: 'text-pink-400' },
            'U_PUT_YOUR_UID_HERE': { id: 'S03', name: '高山茶語民宿', category: 'stay', typeName: '住宿', color: 'text-teal-400' }
        };

        const Toast = ({ message }) => {
            if (!message) return null;
            return (
                <div className="fixed top-12 left-1/2 z-[9999] bg-slate-800/95 text-white px-6 py-3 rounded-full shadow-2xl animate-slide-down flex items-center space-x-2 whitespace-nowrap font-bold text-sm backdrop-blur-sm border border-slate-600">
                    <span>{message}</span>
                </div>
            );
        };

        function App() {
            const [role, setRole] = useState('customer');
            const [activeShop, setActiveShop] = useState(null);
            const [customerPoints, setCustomerPoints] = useState({ food: 0, souvenir: 0, stay: 0 }); 
            const [logs, setLogs] = useState([]); 
            const [copied, setCopied] = useState(false);
            const [isLiffInit, setIsLiffInit] = useState(false);
            const [userProfile, setUserProfile] = useState(null);
            const [toastMsg, setToastMsg] = useState(null);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(null), 3000);
            };

            useEffect(() => {
                const initLiff = async () => {
                    try {
                        await liff.init({ liffId: '2009010332-AYjg84ly' }); 
                        if (!liff.isLoggedIn()) {
                            liff.login();
                        } else {
                            const profile = await liff.getProfile();
                            setUserProfile(profile);
                            
                            if (SHOP_ADMINS[profile.userId]) {
                                setRole('shop');
                                setActiveShop(SHOP_ADMINS[profile.userId]);
                            } else {
                                setRole('customer');
                            }
                            setIsLiffInit(true);
                        }
                    } catch (err) {
                        console.error('LIFF Error', err);
                        setUserProfile({ userId: 'U_GUEST_12345', displayName: '測試遊客' });
                        setIsLiffInit(true); 
                    }
                };
                initLiff();
            }, []);

            const copyUID = () => {
                if(userProfile && userProfile.userId) {
                    navigator.clipboard.writeText(userProfile.userId).then(() => {
                        setCopied(true);
                        showToast('✅ UID 已複製到剪貼簿！');
                        setTimeout(() => setCopied(false), 2000);
                    });
                }
            };

            const addLog = (message) => {
                const time = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second:'2-digit' });
                setLogs(prev => [`[${time}] ${message}`, ...prev]);
            };

            if (!isLiffInit) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 text-teal-600">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-4 border-teal-600 mb-4"></div>
                        <div className="font-bold tracking-wider text-slate-600">驗證 LINE 授權中...</div>
                    </div>
                );
            }

            return (
                <div className="app-container flex flex-col font-sans">
                    <Toast message={toastMsg} />
                    
                    <div className="bg-slate-800 text-white p-3 flex justify-between items-center text-sm z-50 shadow-md">
                        <div className="flex items-center space-x-2 font-bold">
                            {userProfile ? (
                                <>
                                    <img src={userProfile.pictureUrl || 'https://placehold.co/100'} alt="Avatar" className="w-7 h-7 rounded-full border border-slate-500" />
                                    <span>{userProfile.displayName}</span>
                                </>
                            ) : (
                                <span>測試模式</span>
                            )}
                        </div>
                        {userProfile && (
                            <div 
                                className="text-[10px] bg-slate-700/50 px-2 py-1 rounded cursor-pointer hover:bg-slate-600 transition-colors flex items-center" 
                                onClick={copyUID}
                            >
                                <span className={copied ? "text-green-400 font-bold" : "text-slate-200"}>
                                    {copied ? "已複製!" : `UID: ${userProfile.userId.substring(0,6)}...`}
                                </span>
                            </div>
                        )}
                    </div>

                    <div className="flex-1 overflow-y-auto bg-slate-50 hide-scrollbar relative">
                        {role === 'customer' 
                            ? <CustomerView pointsObj={customerPoints} setPointsObj={setCustomerPoints} addLog={addLog} userProfile={userProfile} showToast={showToast} /> 
                            : <ShopView activeShop={activeShop} setCustomerPoints={setCustomerPoints} addLog={addLog} showToast={showToast} />
                        }
                    </div>
                </div>
            );
        }

        function CustomerView({ pointsObj, setPointsObj, addLog, userProfile, showToast }) {
            const [redeemModal, setRedeemModal] = useState(null); 
            const [staffPassword, setStaffPassword] = useState('');
            const [redeemHistory, setRedeemHistory] = useState([]); 
            const [activeTab, setActiveTab] = useState('card'); 
            const [showBindingModal, setShowBindingModal] = useState(false);
            
            // 新增：申請店家的名稱輸入狀態
            const [applyShopName, setApplyShopName] = useState('');

            const [currentPage, setCurrentPage] = useState(0);
            const scrollContainerRef = useRef(null);

            const totalPoints = pointsObj.food + pointsObj.souvenir + pointsObj.stay;

            const handleScroll = () => {
                if (scrollContainerRef.current) {
                    const scrollLeft = scrollContainerRef.current.scrollLeft;
                    const width = scrollContainerRef.current.clientWidth;
                    const page = Math.round(scrollLeft / width);
                    if (page !== currentPage) setCurrentPage(page);
                }
            };

            const redeemGifts = [
                { id: 1, name: '商圈特色伴手禮', cost: 5 },
                { id: 2, name: '在地小吃兌換券', cost: 5 },
                { id: 3, name: '風格文創帆布袋', cost: 10 },
                { id: 4, name: '雙人住宿抵用金', cost: 25 },
            ];

            const initiateRedeem = (gift) => {
                if (totalPoints >= gift.cost) setRedeemModal(gift); 
                else showToast('點數不足喔！請繼續在商圈消費集點。');
            };

            const confirmStaffRedeem = () => {
                if (staffPassword !== '8888') {
                    showToast('❌ 工作人員密碼錯誤！');
                    return;
                }
                let pointsToDeduct = redeemModal.cost;
                let newPoints = { ...pointsObj };
                const categories = ['food', 'souvenir', 'stay'];
                
                for (let cat of categories) {
                    if (pointsToDeduct <= 0) break;
                    if (newPoints[cat] >= pointsToDeduct) {
                        newPoints[cat] -= pointsToDeduct;
                        pointsToDeduct = 0;
                    } else {
                        pointsToDeduct -= newPoints[cat];
                        newPoints[cat] = 0;
                    }
                }

                const serialNumber = `R-${Math.floor(100000 + Math.random() * 900000)}`;
                const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

                setPointsObj(newPoints);
                setRedeemHistory(prev => [{ giftName: redeemModal.name, sn: serialNumber, time: timeStr }, ...prev]);
                showToast('✅ 兌換成功！');
                setRedeemModal(null);
                setStaffPassword('');
            };

            const renderPages = () => {
                let stickers = [];
                for(let i=0; i<pointsObj.food; i++) stickers.push('text-orange-400');
                for(let i=0; i<pointsObj.souvenir; i++) stickers.push('text-pink-400');
                for(let i=0; i<pointsObj.stay; i++) stickers.push('text-teal-400');

                const totalPages = Math.max(1, Math.ceil(stickers.length / 10));
                const pages = [];
                
                for (let p = 0; p < totalPages; p++) {
                    const slots = [];
                    for (let i = 0; i < 10; i++) {
                        const globalIndex = p * 10 + i;
                        if (stickers[globalIndex]) {
                            slots.push(
                                <div key={i} className="relative flex items-center justify-center w-12 h-12 transform hover:scale-110 transition-transform">
                                    <CloudIcon className={`w-14 h-14 ${stickers[globalIndex]} absolute z-10 drop-shadow-sm`} />
                                    <span className="z-20 text-white text-xs font-bold pt-1">{globalIndex + 1}</span>
                                </div>
                            );
                        } else {
                            slots.push(
                                <div key={i} className="relative flex items-center justify-center w-12 h-12 opacity-40">
                                    <CloudIcon className="w-14 h-14 text-white absolute z-10" />
                                    <span className="z-20 text-teal-700/30 text-xs font-bold pt-1">{globalIndex + 1}</span>
                                </div>
                            );
                        }
                    }
                    
                    pages.push(
                        <div key={p} className="min-w-full flex-shrink-0 px-2 snap-center">
                            <div className="grid grid-cols-5 gap-y-4 gap-x-2 justify-items-center">
                                {slots}
                            </div>
                        </div>
                    );
                }
                return { pages, totalPages };
            };

            const { pages, totalPages } = renderPages();

            return (
                <div className="min-h-full pb-10">
                    <div className="bg-gradient-primary rounded-b-[40px] pb-8 pt-6 px-4 shadow-sm relative z-10">
                        <div className="flex justify-between items-center text-teal-900 mb-6 px-2">
                            <span className="font-bold text-lg tracking-wider">商圈漫遊集點卡</span>
                        </div>
                        
                        <div className="text-center text-teal-900 mb-4">
                            <div className="text-sm opacity-80 mb-1 font-bold tracking-wide">目前總點數</div>
                            <div className="text-6xl font-extrabold drop-shadow-sm flex justify-center items-baseline space-x-2">
                                <span>{totalPoints}</span> <span className="text-2xl font-bold">點</span>
                            </div>
                        </div>

                        {/* 點數卡片區 */}
                        <div className="bg-white/40 backdrop-blur-md rounded-3xl py-5 border border-white/60 shadow-sm mt-4 overflow-hidden relative">
                            <div ref={scrollContainerRef} onScroll={handleScroll} className="flex overflow-x-auto snap-x snap-mandatory hide-scrollbar scroll-smooth">
                                {pages}
                            </div>
                            
                            {totalPages > 1 && (
                                <div className="flex justify-center space-x-2 mt-4">
                                    {Array.from({ length: totalPages }).map((_, idx) => (
                                        <div key={idx} className={`h-2 rounded-full transition-all duration-300 ${currentPage === idx ? 'w-4 bg-teal-600' : 'w-2 bg-teal-200'}`} />
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        {/* 🌟 修改點 1：會員條碼直接顯示在集點卡下方 */}
                        <div className="bg-white rounded-3xl mt-4 p-5 shadow-sm text-center flex flex-col items-center border border-teal-50">
                            <h3 className="font-bold text-sm text-teal-800 mb-2">出示此條碼給店家發送點數</h3>
                            <div className="bg-slate-50 p-2 inline-block border-2 border-slate-100 rounded-xl">
                                <img 
                                    src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${userProfile?.userId || 'GUEST_MODE_UID'}`} 
                                    alt="QR Code" 
                                    className="w-32 h-32" 
                                />
                            </div>
                            <span className="text-[10px] text-slate-400 font-mono mt-2 bg-slate-100 px-2 py-1 rounded">
                                UID: {userProfile?.userId || '尚未登入 LINE'}
                            </span>
                        </div>
                    </div>

                    <div className="flex justify-center space-x-4 mt-6 mb-4 px-2 border-b border-teal-100">
                        <button onClick={() => setActiveTab('card')} className={`pb-2 font-bold text-sm transition-colors px-2 ${activeTab === 'card' ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-400'}`}>獎項兌換</button>
                        <button onClick={() => setActiveTab('rules')} className={`pb-2 font-bold text-sm transition-colors px-2 ${activeTab === 'rules' ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-400'}`}>紀錄與辦法</button>
                        <button onClick={() => setActiveTab('map')} className={`pb-2 font-bold text-sm transition-colors px-2 ${activeTab === 'map' ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-400'}`}>商圈地圖</button>
                    </div>

                    {activeTab === 'card' && (
                        <div className="px-5 space-y-4 animate-fade-in">
                            {redeemGifts.map(gift => {
                                const canRedeem = totalPoints >= gift.cost;
                                return (
                                    <div key={gift.id} onClick={() => initiateRedeem(gift)} className={`bg-white p-4 rounded-2xl shadow-sm border-2 transition-all ${canRedeem ? 'border-teal-500 cursor-pointer active:scale-95' : 'border-slate-100 opacity-60'}`}>
                                        <div className="flex justify-between items-center">
                                            <div className="flex items-center space-x-4">
                                                <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl ${canRedeem ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-400'}`}>🎁</div>
                                                <div>
                                                    <div className="font-bold text-slate-800">{gift.name}</div>
                                                    <div className={`text-sm font-bold mt-1 ${canRedeem ? 'text-teal-600' : 'text-slate-400'}`}>{gift.cost} 點</div>
                                                </div>
                                            </div>
                                            <button className={`px-4 py-2 rounded-xl text-sm font-bold text-white shadow-sm transition-colors ${canRedeem ? 'bg-teal-600 hover:bg-teal-700' : 'bg-slate-300'}`}>兌換</button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {activeTab === 'rules' && (
                        <div className="px-5 space-y-6 animate-fade-in">
                            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center"><span className="text-teal-500 mr-2">✦</span> 我的兌換紀錄</h3>
                                {redeemHistory.length === 0 ? (
                                    <p className="text-center text-slate-400 text-sm py-4">尚無兌換紀錄</p>
                                ) : (
                                    <div className="space-y-3">
                                        {redeemHistory.map((record, idx) => (
                                            <div key={idx} className="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center">
                                                <div>
                                                    <div className="font-bold text-slate-700 text-sm">{record.giftName}</div>
                                                    <div className="text-xs text-slate-400 mt-1">{record.time}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-[10px] text-slate-400 mb-1">核銷序號</div>
                                                    <div className="text-teal-600 font-mono font-bold text-sm bg-teal-50 px-2 py-1 rounded">{record.sn}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {activeTab === 'map' && (
                        <div className="px-5 space-y-4 animate-fade-in pb-8">
                           <div className="bg-white rounded-2xl p-1 shadow-md border border-slate-200 h-[500px] w-full overflow-hidden relative z-0">
                               <MapComponent showToast={showToast} />
                           </div>
                        </div>
                    )}

                    <div className="px-5 mt-12 mb-8 text-center">
                        <button onClick={() => setShowBindingModal(true)} className="text-xs text-slate-400 underline decoration-slate-300 hover:text-slate-600">
                            我是合作店家，需要開通發送點數權限
                        </button>
                    </div>

                    {/* 兌換大會密碼 Modal */}
                    {redeemModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-5">
                            <div className="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl animate-fade-in relative z-50">
                                <div className="bg-rose-500 p-4 text-center text-white">
                                    <h3 className="font-bold text-lg">⚠️ 大會人員核銷專區</h3>
                                </div>
                                <div className="p-6 text-center">
                                    <p className="font-bold text-xl mb-2 mt-1">{redeemModal.name}</p>
                                    <p className="text-rose-500 font-bold mb-6">將扣除 {redeemModal.cost} 點</p>
                                    <input 
                                        type="password" placeholder="輸入密碼(8888)" value={staffPassword} onChange={(e) => setStaffPassword(e.target.value)}
                                        className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-center text-xl mb-6 outline-none"
                                    />
                                    <div className="flex space-x-3">
                                        <button onClick={() => setRedeemModal(null)} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold">取消</button>
                                        <button onClick={confirmStaffRedeem} className="flex-1 py-3 rounded-xl bg-rose-500 text-white font-bold">確認扣點</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* 🌟 修改點 2：店家開通申請，加入店名輸入框 */}
                    {showBindingModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-5">
                            <div className="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl animate-fade-in relative z-50">
                                <div className="bg-slate-800 p-4 text-center text-white">
                                    <h3 className="font-bold text-lg">店家開通申請</h3>
                                </div>
                                <div className="p-6 text-center">
                                    <p className="text-sm text-slate-600 mb-4">請填寫您的店名，並將代碼傳送給大會，以開通發送點數的權限。</p>
                                    
                                    <input 
                                        type="text" 
                                        placeholder="請輸入您的店名 (如：太平牛肉麵)"
                                        value={applyShopName}
                                        onChange={(e) => setApplyShopName(e.target.value)}
                                        className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-center text-sm mb-4 outline-none focus:border-teal-400"
                                    />

                                    <div className="bg-slate-100 p-3 rounded-xl font-mono text-xs text-slate-800 break-all mb-6 font-bold border-2 border-slate-200">
                                        UID: {userProfile ? userProfile.userId : "無法取得，請確認已登入 LINE"}
                                    </div>
                                    
                                    <div className="flex flex-col space-y-3">
                                        <a 
                                            href={`https://line.me/R/msg/text/?你好，我要綁定店家系統！%0A我的店名是：${applyShopName || '未填寫'}%0A我的專屬代碼是：${userProfile?.userId}`} 
                                            target="_blank"
                                            className="w-full py-3 rounded-xl bg-green-500 text-white font-bold shadow-md hover:bg-green-600 block text-center"
                                        >
                                            一鍵傳送 LINE 給大會
                                        </a>
                                        <button onClick={() => setShowBindingModal(false)} className="w-full py-3 rounded-xl bg-slate-100 text-slate-600 font-bold">稍後再說</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function MapComponent({ showToast }) {
            const mapRef = useRef(null);

            const getCategoryEmoji = (categories) => {
                if (!categories || categories.length === 0) return '📍';
                const cat = Array.isArray(categories) ? categories[0].toLowerCase() : categories.toLowerCase();
                if (cat.includes('accommodation') || cat.includes('民宿') || cat.includes('住宿')) return '🏠';
                if (cat.includes('food') || cat.includes('美食') || cat.includes('小吃') || cat.includes('餐廳') || cat.includes('麵')) return '🍽️';
                if (cat.includes('attraction') || cat.includes('景點') || cat.includes('步道')) return '🥾';
                if (cat.includes('experience') || cat.includes('體驗')) return '✨';
                if (cat.includes('transport') || cat.includes('交通')) return '🚌';
                if (cat.includes('gift') || cat.includes('伴手禮') || cat.includes('商店')) return '🎁';
                return '📍';
            };

            // 負責把資料畫到地圖上的核心函數
            const renderShopsToMap = (map, shops) => {
                shops.forEach(shop => {
                    if (shop.lat && shop.lng) {
                        const emoji = getCategoryEmoji(shop.category);
                        const customIcon = L.divIcon({
                            className: 'custom-marker',
                            html: `<div class="w-8 h-8 rounded-full flex items-center justify-center shadow-md text-base" style="background-color: #1f2937; border: 2px solid #e2e8f0; color: white;">${emoji}</div>`,
                            iconSize: [32, 32],
                            iconAnchor: [16, 32],
                            popupAnchor: [0, -32]
                        });

                        const googleMapsLink = `https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}`;
                        
                        let popupContent = `<div class="font-sans w-48">`;
                        if (shop.photo) {
                            popupContent += `<div class="w-full h-24 mb-2 rounded-lg overflow-hidden bg-slate-100"><img src="${shop.photo}" class="w-full h-full object-cover" alt="店家照片" /></div>`;
                        }
                        popupContent += `
                            <strong class="text-teal-700 block text-base mb-1">${shop.name}</strong>
                            ${shop.category ? `<span class="bg-slate-100 text-slate-500 text-[10px] px-2 py-0.5 rounded">${Array.isArray(shop.category) ? shop.category.join(', ') : shop.category}</span>` : ''}
                            ${shop.phone ? `<div class="text-xs text-slate-600 mt-1">📞 ${shop.phone}</div>` : ''}
                            ${shop.address ? `<div class="text-xs text-slate-500 mt-1">📍 ${shop.address}</div>` : ''}
                            ${shop.description ? `<div class="text-xs text-slate-500 mt-2 line-clamp-2">${shop.description}</div>` : ''}
                            <a href="${googleMapsLink}" target="_blank" class="block w-full text-center bg-teal-500 text-white text-xs font-bold py-2 rounded-lg mt-3 shadow-sm hover:bg-teal-600">Google 實景導航</a>
                        </div>`;

                        L.marker([shop.lat, shop.lng], { icon: customIcon }).addTo(map).bindPopup(popupContent);
                    }
                });
            };

            useEffect(() => {
                if (mapRef.current) return;

                // 📍 將地圖中心點精確鎖定在梅山太平老街
                const map = L.map('map-container', { zoomControl: false }).setView([23.559, 120.605], 16);
                L.control.zoom({ position: 'bottomright' }).addTo(map);
                mapRef.current = map;

                // 🎨 使用 Carto Voyager 探索者地圖底圖
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 20,
                    attribution: '© OpenStreetMap © CARTO'
                }).addTo(map);

                // 🌟 修改點 3：智慧判斷機制 (預覽環境備用資料)
                fetch('/api/shops')
                    .then(res => {
                        if (!res.ok) throw new Error('找不到後端 API');
                        return res.json();
                    })
                    .then(shops => {
                        renderShopsToMap(map, shops); // 如果在正式版 Vercel，就畫出 Airtable 真實資料
                    })
                    .catch(err => {
                        console.warn("📌 目前在預覽環境，啟用備用測試資料！");
                        // 這是備用的太平老街店家資料，讓你在預覽模式也能看到地圖運作！
                        const mockShops = [
                            { name: '太平雲梯遊客中心', category: '景點', lat: 23.5593, lng: 120.6015, description: '全台最長景觀吊橋，風景優美。' },
                            { name: '冬瓜妹', category: '小吃', lat: 23.5588, lng: 120.6052, description: '知名茶葉蛋與特調冬瓜茶。' },
                            { name: '太平老街牛肉麵', category: '美食', lat: 23.5590, lng: 120.6045, description: '在地人推薦的熱呼呼大碗牛肉麵。' },
                            { name: '隆榮商店', category: '伴手禮', lat: 23.5585, lng: 120.6048, description: '充滿懷舊風情的在地雜貨與伴手禮店。' }
                        ];
                        renderShopsToMap(map, mockShops);
                    });

                return () => {
                    if (mapRef.current) {
                        mapRef.current.remove();
                        mapRef.current = null;
                    }
                };
            }, []);

            return <div id="map-container" className="w-full h-full z-0 rounded-2xl relative"></div>;
        }

        function ShopView({ activeShop, setCustomerPoints, addLog, showToast }) {
            const [scanStatus, setScanStatus] = useState('idle'); 
            const [scannedUid, setScannedUid] = useState('');
            const [amount, setAmount] = useState('');
            const scannerRef = useRef(null);

            const parsedAmount = parseInt(amount, 10) || 0;
            const calculatedPoints = Math.floor(parsedAmount / 200);

            useEffect(() => {
                if (scanStatus === 'scanning') {
                    const scanner = new Html5Qrcode("reader");
                    scannerRef.current = scanner;
                    
                    scanner.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 250 } },
                        (decodedText) => {
                            scanner.stop().then(() => {
                                setScannedUid(decodedText);
                                setScanStatus('found');
                                showToast('✅ 成功鎖定遊客條碼！');
                            });
                        },
                        (err) => { }
                    ).catch(err => {
                        console.error(err);
                        showToast("⚠️ 無法啟動相機，請確認已給予權限！");
                        setScanStatus('idle');
                    });
                }
                
                return () => {
                    if (scannerRef.current && scannerRef.current.isScanning) {
                        scannerRef.current.stop().catch(e => console.log(e));
                    }
                };
            }, [scanStatus]);

            const handleConfirm = () => {
                setScanStatus('confirm');
            };

            const handleSubmit = () => {
                if (calculatedPoints <= 0) return;
                
                setCustomerPoints(prev => ({ 
                    ...prev, 
                    [activeShop.category]: prev[activeShop.category] + calculatedPoints 
                }));
                
                showToast(`🎉 成功發送 ${calculatedPoints} 點給遊客！`);
                setAmount('');
                setScanStatus('idle');
            };

            return (
                <div className="p-5 min-h-full">
                    <div className="bg-white rounded-3xl p-6 shadow-md relative overflow-hidden">
                        <div className="text-center mb-6">
                            <h2 className="font-bold text-xl text-slate-800">{activeShop.name}</h2>
                            <span className="text-xs text-slate-400">發點專員介面</span>
                        </div>
                        
                        {scanStatus === 'idle' && (
                            <button onClick={() => setScanStatus('scanning')} className="w-full bg-teal-500 text-white font-bold py-12 rounded-2xl text-lg flex flex-col items-center shadow-lg active:scale-95 transition-transform">
                                <span className="text-5xl mb-3">📷</span>
                                點此開啟相機<br/>掃描遊客條碼
                            </button>
                        )}

                        {scanStatus === 'scanning' && (
                            <div className="animate-fade-in">
                                <div className="bg-slate-900 rounded-2xl overflow-hidden shadow-inner mb-4">
                                    <div id="reader" className="w-full"></div>
                                </div>
                                <button onClick={() => setScanStatus('idle')} className="w-full bg-slate-100 text-slate-600 font-bold py-3 rounded-xl active:scale-95">
                                    取消掃描
                                </button>
                            </div>
                        )}

                        {scanStatus === 'found' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-emerald-50 text-emerald-700 p-3 rounded-xl text-center text-sm font-bold border border-emerald-100 flex flex-col items-center justify-center">
                                    <span>✅ 已鎖定遊客</span>
                                    <span className="text-[10px] font-mono mt-1 opacity-70">UID: {scannedUid.substring(0,8)}...</span>
                                </div>
                                
                                <div>
                                    <label className="block text-slate-500 text-sm font-bold mb-2 text-center">請輸入本次結帳總金額 (NT$)</label>
                                    <input 
                                        type="number" value={amount} onChange={(e) => setAmount(e.target.value)} 
                                        className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-4 text-3xl text-center font-bold outline-none focus:border-teal-400" 
                                        placeholder="0" 
                                    />
                                </div>
                                
                                <div className="bg-teal-50 p-4 rounded-2xl flex justify-between items-center font-bold border border-teal-100">
                                    <span className="text-teal-800">換算點數</span>
                                    <span className="text-3xl text-teal-600">{calculatedPoints} 點</span>
                                </div>
                                
                                <div className="flex space-x-3 pt-2">
                                    <button onClick={() => setScanStatus('idle')} className="flex-1 bg-slate-100 py-4 rounded-2xl font-bold text-slate-600 active:scale-95">重來</button>
                                    <button onClick={handleConfirm} disabled={calculatedPoints<=0} className={`flex-[2] py-4 rounded-2xl font-bold text-white transition-all active:scale-95 ${calculatedPoints > 0 ? 'bg-teal-500' : 'bg-slate-300'}`}>下一步</button>
                                </div>
                            </div>
                        )}

                        {scanStatus === 'confirm' && (
                            <div className="space-y-6 animate-fade-in text-center p-4">
                                <div className="text-6xl mb-4">🎁</div>
                                <h3 className="font-bold text-2xl text-slate-800 mb-2">確認發送？</h3>
                                <p className="text-slate-600">即將發送 <strong className="text-teal-600 text-xl">{calculatedPoints}</strong> 點給該名遊客</p>
                                
                                <div className="flex space-x-3 mt-8">
                                    <button onClick={() => setScanStatus('found')} className="flex-1 bg-slate-100 py-4 rounded-2xl font-bold text-slate-600 active:scale-95">返回修改</button>
                                    <button onClick={handleSubmit} className="flex-[2] py-4 rounded-2xl font-bold text-white bg-rose-500 shadow-md active:scale-95">確認發出</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
